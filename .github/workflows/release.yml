name: Release

# Pushing a tag vX.Y.Z makes a GitHub release whose notes list the commits since the previous tag.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all commits and tags, to find the previous tag
      - name: Create the release
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          {
            echo "## Changes${prev:+ since $prev}"
            echo
            git log --no-merges --reverse --format='- %s (%h)' "$range"
            if [[ -n $prev ]]; then
              echo
              echo "**Full diff:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$TAG"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          flags=()
          [[ $TAG == *-* ]] && flags+=(--prerelease) # v1.2.0-rc1
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
